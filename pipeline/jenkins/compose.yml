name: delivery-jenkins

services:
  jenkins:
    build: .
    image: delivery-platform/jenkins:2.580.2
    container_name: jenkins

    ports:
      - "127.0.0.1:8090:8080"

    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?set it in .env}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set it in .env}

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    # Group of /var/run/docker.sock (root:root 660 on Docker Desktop).
    # Adds the jenkins user to that group; the container still runs as jenkins, not root.
    group_add:
      - "0"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

    restart: unless-stopped

  # Forwards GitHub push events from the smee.io channel to Jenkins' webhook endpoint.
  # It only opens an outbound connection: no port is published and Jenkins stays on 127.0.0.1.
  smee:
    build: ./smee
    image: delivery-platform/smee-client:5.0.0
    container_name: jenkins-smee
    # The query string is deliberate: smee-client removes a trailing '/' from the target, and
    # Jenkins answers '/github-webhook' (no slash) with a redirect that turns the POST into a GET (405).
    command:
      - --url
      - ${SMEE_URL:?set it in .env}
      - --target
      - http://jenkins:8080/github-webhook/?source=smee
    depends_on:
      jenkins:
        condition: service_healthy
    restart: unless-stopped

volumes:
  jenkins_home: