# Jenkins jobs, defined as code with the Job DSL plugin and applied by Configuration as Code on every start.
# Server settings live in jenkins.yml.
#
# Each '- script:' entry is a Job DSL (Groovy) script. Inside it:
#   - comments use '//' (a '#' would be passed to Groovy and break the script);
#   - a literal '${...}' must be written '^${...}', otherwise Configuration as Code
#     tries to replace it with an environment variable.
#
# Removing a job from this file does NOT delete it from Jenkins; delete it in the UI
# (or recreate Jenkins with 'docker compose down -v').
jobs:
  - script: |
      // A single Pipeline job. What the build does is defined in the Jenkinsfile, not here:
      // this job only says WHERE to find the code and the Jenkinsfile.
      pipelineJob('delivery-platform') {
        parameters {
            stringParam('BRANCH', 'main' , 'Branch to build. Use main except for experiments such as the failure exercise.')
        }
        description('Builds and tests the Delivery Platform application. Defined in pipeline/jenkins/casc/jobs.yml.')

        definition {
          // Load the pipeline from source control ("Pipeline script from SCM").
          cpsScm {
            scm {
              git {
                remote {
                  // Public repository: no credentials needed to clone.
                  url('https://github.com/AfonsoRocha10/Delivery-Platform.git')
                }
                branch('*/^${BRANCH}')
                extensions {
                  // A push builds only if it changes the application or the pipeline
                  // (one Java regex per line). Changes to other files, e.g. README.md, are ignored.
                  pathRestriction {
                    includedRegions('app/.*\npipeline/Jenkinsfile')
                    excludedRegions('')
                  }
                }
              }
            }
            // Location of the Jenkinsfile inside the repository.
            scriptPath('pipeline/Jenkinsfile')
            // Read only the Jenkinsfile first instead of cloning the whole repository;
            // the full checkout happens inside the pipeline.
            lightweight(true)
          }
        }

        // Build automatically when a commit is pushed to main: GitHub sends a webhook (through the
        // smee relay in compose.yml) and Jenkins checks main once. No scheduled polling.
        // "Build with Parameters" still works for manual builds of other branches.
        properties {
          pipelineTriggers {
            triggers {
              githubPush()
            }
          }
        }
      }