# Jenkins server settings, applied by the Configuration as Code plugin on every start.
# Jobs live in jobs.yml; a setting must not be defined in both files.
jenkins:
  systemMessage: >-
    Delivery Platform CI. Configured as code (pipeline/jenkins/casc);
    changes made in the UI are lost on restart.

  # Builds run on the built-in node (no separate agents yet). Set to 0 once a dedicated agent exists.
  numExecutors: 2
  mode: NORMAL

  # Who can log in: Jenkins' own user database, single admin user, no self sign-up.
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          name: "Administrator"
          password: "${JENKINS_ADMIN_PASSWORD}"   # from .env via compose.yml

  # What logged-in users can do: everything. Anonymous visitors see only the login page.
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  # No inbound agent port (50000): there are no remote agents.
  slaveAgentPort: -1

credentials:
  system:
    domainCredentials:
      - credentials:
          # Secret GitHub signs webhook events with (from .env via compose.yml).
          - string:
              scope: GLOBAL
              id: "github-webhook-secret"
              description: "GitHub webhook signature secret"
              secret: "${GITHUB_WEBHOOK_SECRET}"

unclassified:
  # Address Jenkins uses in links to itself. Must match the URL used in the browser.
  location:
    url: "http://localhost:8090/"

  # GitHub plugin: reject webhook events that are not signed with the secret above.
  # The webhook itself is created in the GitHub repository settings, not by Jenkins.
  gitHubPluginConfig:
    hookSecretConfigs:
      - credentialsId: "github-webhook-secret"