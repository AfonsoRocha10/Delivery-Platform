spring:
  application:
    name: delivery-service
  # The database connection comes only from the environment, so the image holds no credentials:
  #   SPRING_DATASOURCE_URL       e.g. jdbc:postgresql://localhost:5432/delivery
  #   SPRING_DATASOURCE_USERNAME
  #   SPRING_DATASOURCE_PASSWORD
  # Tests get the connection from the Testcontainers PostgreSQL container instead.
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it at startup.
      ddl-auto: validate
    # Keep database access inside the service layer instead of holding a session for the whole request.
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        # Expose only the health endpoint over HTTP; other actuator endpoints can leak internal details.
        include: health
  endpoint:
    health:
      group:
        readiness:
          # Not ready while the database is down. Liveness deliberately excludes the database:
          # restarting the app does not fix a database outage.
          include: readinessState,db
